#File related configuration
# Enable multipart uploads

spring.servlet.multipart.enabled=true

# Set the maximum size for a single uploaded file (e.g., 10MB)
spring.servlet.multipart.max-file-size=10MB

# Set the maximum total request size for multipart requests (e.g., 50MB)
spring.servlet.multipart.max-request-size=50MB

# Threshold after which files are written directly to disk instead of memory
spring.servlet.multipart.file-size-threshold=2KB

# Optional: Path where uploaded files will be permanently stored on the server
file.upload-dir=./uploads

